<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pluto TV Brasil • IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box}body{margin:0;color:#eef7ff;font-family:Inter,system-ui,Arial,sans-serif;background:linear-gradient(135deg,rgba(4,14,28,.78),rgba(10,35,58,.76)),url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=2200&q=85') center/cover fixed}header{position:sticky;top:0;z-index:10;padding:24px 5%;background:rgba(3,12,23,.78);backdrop-filter:blur(14px);border-bottom:1px solid #55c7ff44}h1{margin:0 0 5px}.sub{color:#a9bfd4}.status{margin-top:12px;color:#72d7ff}main{width:92%;max-width:1500px;margin:28px auto}section{margin-bottom:24px;padding:20px;border:1px solid #55c7ff30;border-radius:18px;background:#071728cc;backdrop-filter:blur(10px)}h2{margin:0 0 15px;color:#8fdcff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px}.channel{appearance:none;width:100%;border:1px solid #65cfff22;border-radius:12px;padding:15px;text-align:left;color:#fff;background:#102942dd;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.15s}.channel:hover{transform:translateY(-2px);background:#15507bdd;border-color:#65cfff88}.play{color:#67d5ff;font-size:20px}.search{width:100%;margin-top:15px;padding:11px;border-radius:9px;border:1px solid #55c7ff44;background:#061321cc;color:white}.modal{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.84);align-items:center;justify-content:center;padding:25px}.modal.open{display:flex}.box{width:min(1100px,96vw);background:#081728;border:1px solid #55c7ff55;border-radius:16px;overflow:hidden;box-shadow:0 20px 80px #000}.bar{display:flex;justify-content:space-between;align-items:center;padding:13px 16px}.close{border:0;border-radius:8px;padding:8px 12px;cursor:pointer;background:#173651;color:white}video{width:100%;max-height:75vh;background:#000;display:block}.error{padding:20px;color:#ffb6b6}small{color:#91a8bb}
</style>
</head>
<body>
<header><h1>Pluto TV Brasil</h1><div class="sub">Clique no canal para abrir a transmissão diretamente no player.</div><input id="search" class="search" placeholder="Pesquisar canal..." oninput="filterChannels()"><div id="status" class="status">Carregando lista IPTV...</div></header>
<main id="content"></main>
<div id="modal" class="modal"><div class="box"><div class="bar"><strong id="title">Canal</strong><button class="close" onclick="closePlayer()">Fechar</button></div><video id="video" controls autoplay playsinline></video><div id="err" class="error" hidden></div></div></div>
<script>
const M3U='https://raw.githubusercontent.com/BuddyChewChew/pluto/main/pluto_br.m3u';
let channels=[];let hls=null;
function parseM3U(txt){const a=txt.split(/\r?\n/);const out=[];for(let i=0;i<a.length;i++){if(a[i].startsWith('#EXTINF')){const info=a[i], url=(a[i+1]||'').trim();const n=info.match(/,(.*)$/),g=info.match(/group-title="([^"]*)"/);if(url.startsWith('http'))out.push({name:n?n[1].trim():'Canal',group:g?g[1]:'Outros',url});}}return out}
function render(){const root=document.getElementById('content'), groups={};channels.forEach(c=>(groups[c.group]??=[]).push(c));root.innerHTML='';for(const [g,list] of Object.entries(groups)){const s=document.createElement('section');s.innerHTML=`<h2>${escapeHtml(g)}</h2><div class="grid"></div>`;const grid=s.querySelector('.grid');list.forEach(c=>{const b=document.createElement('button');b.className='channel';b.dataset.name=c.name.toLowerCase();b.innerHTML=`<span>${escapeHtml(c.name)}</span><span class="play">▶</span>`;b.onclick=()=>play(c);grid.appendChild(b)});root.appendChild(s)}document.getElementById('status').textContent=`${channels.length} canais carregados`}
function filterChannels(){const q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.channel').forEach(b=>b.style.display=b.dataset.name.includes(q)?'flex':'none');document.querySelectorAll('section').forEach(s=>{s.style.display=[...s.querySelectorAll('.channel')].some(b=>b.style.display!=='none')?'block':'none'})}
function play(c){const modal=document.getElementById('modal'),video=document.getElementById('video'),err=document.getElementById('err');document.getElementById('title').textContent=c.name;err.hidden=true;err.textContent='';modal.classList.add('open');if(hls){hls.destroy();hls=null}if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=c.url;video.play().catch(()=>{})}else if(Hls.isSupported()){hls=new Hls({enableWorker:true});hls.loadSource(c.url);hls.attachMedia(video);hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){err.hidden=false;err.textContent='Não foi possível reproduzir este stream. A URL HLS pode ter expirado ou o servidor pode bloquear reprodução no navegador.'}})}else{err.hidden=false;err.textContent='Este navegador não possui suporte HLS.'}}
function closePlayer(){const video=document.getElementById('video');video.pause();video.removeAttribute('src');video.load();if(hls){hls.destroy();hls=null}document.getElementById('modal').classList.remove('open')}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
fetch(M3U).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(t=>{channels=parseM3U(t);render()}).catch(e=>{document.getElementById('status').textContent='Não foi possível carregar a lista M3U: '+e.message})
</script>
</body></html>
